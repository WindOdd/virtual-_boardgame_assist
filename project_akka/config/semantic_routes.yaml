# config/semantic_routes.yaml
# 定義語意路由的標準錨點 (Anchors)
# 用於 Semantic Router (e5-small) 建立向量索引
# Optimized v3: 新增 STORE_FOOD / STORE_HOURS，補強既有 intent

# ============================
# 1. 店務類 (Store Info)
# ============================

STORE_WIFI:
  # 複合關鍵詞（≥3字）
  - "WIFI密碼"
  - "無線網路"
  - "網路密碼"

  # 完整問句 - 詢問密碼
  - "wifi密碼是多少"
  - "wifi密碼多少"
  - "請問wifi密碼是什麼"
  - "可以給我wifi密碼嗎"
  - "wifi的密碼"
  - "這邊的wifi密碼"
  - "店裡的wifi密碼"

  # 完整問句 - 詢問是否有wifi
  - "有沒有wifi"
  - "有wifi嗎"
  - "這裡有無線網路嗎"
  - "可以用網路嗎"
  - "有提供wifi嗎"
  - "店裡有wifi嗎"

  # 完整問句 - 連線問題
  - "網路連不上"
  - "wifi連不上"
  - "網路好慢"
  - "網路很慢"
  - "連不到網路"
  - "為什麼連不上wifi"
  - "wifi怎麼連"
  - "網路斷了"
  - "網路不穩"
  - "wifi斷線"

STORE_TOILET:
  # 完整問句 - 詢問位置
  - "廁所在哪"
  - "廁所在哪裡"
  - "請問廁所在哪"
  - "洗手間在哪"
  - "洗手間在哪裡"
  - "化妝室在哪"
  - "哪裡有廁所"
  - "哪裡可以上廁所"
  - "請問洗手間怎麼走"
  - "廁所怎麼走"
  - "廁所在哪邊"

  # 完整問句 - 口語化表達
  - "我要尿尿"
  - "我想上廁所"
  - "我要上廁所"
  - "我想去洗手間"
  - "可以借廁所嗎"
  - "有廁所嗎"
  - "店裡有廁所嗎"
  - "想去洗手間"
  - "要去廁所"

STORE_ADDRESS:
  - "店的地址在哪裡"
  - "請問怎麼去你們店"
  - "最近的捷運站是哪一個"
  - "請問店怎麼走"
  - "你們店在哪裡"
  - "這裡的位置在哪"
  - "怎麼去你們那邊"
  - "門口在哪裡"

STORE_PHONE:
  - "請問電話號碼"
  - "店裡電話多少"
  - "我要打電話訂位"
  - "聯絡電話"
  - "可以給我電話嗎"
  - "有沒有電話"

STORE_FEE:
  # 收費方式
  - "請問怎麼收費"
  - "一個小時多少錢"
  - "包日是多少錢"
  - "入場費怎麼算"
  - "平日和假日價格一樣嗎"
  - "收費標準是什麼"
  - "一個人多少錢"
  - "有低消嗎"
  - "請問計費方式"
  - "費用怎麼算"
  - "收費標準"
  - "一個小時怎麼算"

STORE_INTRO:
  # 商品販售（注意：不含「多少錢」的模糊問法，避免跟 FEE 重疊）
  - "請問這裡有賣這款遊戲嗎"
  - "這盒遊戲賣多少錢"
  - "這款遊戲有現貨嗎"
  - "我想買這款桌遊"
  - "這遊戲可以買回家嗎"
  - "這裡有在賣桌遊嗎"
  - "有沒有賣卡套"
  - "請問有賣骰子嗎"
  - "這裡有賣牌套嗎"
  - "我想買保護套"

# ==================================================
# [NEW] STORE_FOOD — 餐飲服務
# 目標: 攔截所有「吃的喝的」相關問句，不進 LLM Router
# ==================================================
STORE_FOOD:
  # 詢問是否有餐飲
  - "有賣吃的嗎"
  - "這裡有東西吃嗎"
  - "你們有賣食物嗎"
  - "有沒有餐點"
  - "店裡有吃的嗎"

  # 詢問飲料
  - "有飲料嗎"
  - "可以點飲料嗎"
  - "有賣什麼飲料"
  - "有飲料菜單嗎"
  - "我想點杯喝的"
  - "有咖啡嗎"

  # 外食相關
  - "可以帶外食嗎"
  - "能帶自己的東西吃嗎"
  - "可以帶飲料進來嗎"
  - "外食可以嗎"

  # 菜單 / 點餐
  - "有菜單嗎"
  - "菜單在哪"
  - "我想看菜單"
  - "怎麼點餐"
  - "有什麼可以吃的"

  # 口語 / 口頭
  - "肚子好餓"
  - "玩到好餓"
  - "有沒有零食"
  - "想吃點東西"

# ==================================================
# [NEW] STORE_HOURS — 營業時間
# 目標: 攔截所有時間相關問句
# ==================================================
STORE_HOURS:
  # 直接問營業時間
  - "營業時間是什麼時候"
  - "你們營業到幾點"
  - "幾點關門"
  - "幾點開門"
  - "今天開到幾點"
  - "現在還有營業嗎"
  - "你們幾點開始"

  # 假日 / 平日
  - "假日有開嗎"
  - "週末營業到幾點"
  - "平日幾點關"
  - "星期天有開嗎"
  - "週六開到幾點"
  - "禮拜天有營業嗎"

  # 口語化
  - "你們什麼時候開"
  - "還來得及嗎"
  - "現在去還有開嗎"
  - "最晚可以玩到幾點"
  - "可以玩到幾點"
  - "打烊時間是幾點"

# ============================
# 2. 閒聊與招呼
# ============================

GREETING:
  # 完整問候句（≥3字）
  - "你好啊"
  - "嗨你好"
  - "早上好"
  - "晚上好"
  - "午安啊"
  - "Hello你好"

  # 詢問句
  - "有人在嗎"
  - "請問有人嗎"
  - "不好意思"
  - "打擾一下"
  - "在嗎在嗎"
  - "哈囉有人嗎"

IDENTITY:
  # 基礎問句（≥3字）
  - "你是誰"
  - "你是什麼"

  # 完整問句 - 詢問身份
  - "請問你是誰"
  - "你叫什麼"
  - "你叫什麼名字"
  - "你的名字是什麼"
  - "可以介紹一下嗎"
  - "介紹一下你自己"
  - "介紹一下"
  - "自我介紹"
  - "你叫啥名字"

  # 完整問句 - 詢問功能
  - "你會做什麼"
  - "你能幹嘛"
  - "你可以做什麼"
  - "你的功能"
  - "你是機器人嗎"
  - "你是AI嗎"
  - "你能幫我什麼"